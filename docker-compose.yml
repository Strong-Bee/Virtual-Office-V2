version: '3.9'
services:
  nexusos-web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - baileys-auth:/app/.baileys-auth
    environment:
      - NODE_ENV=production
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_BASE_URL=${OPENCLAW_BASE_URL}
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - NINEROUTER_BASE_URL=${NINEROUTER_DOCKER_BASE_URL:-http://host.docker.internal:20128/v1}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  baileys-auth:
